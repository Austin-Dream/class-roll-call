<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷点名系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            color: white;
        }
        
        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }
        
        /* 流星效果 */
        .shooting-star {
            position: absolute;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-45deg);
            opacity: 0;
        }
        
        /* 主界面样式 */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
            animation: glow 2s infinite alternate;
        }
        
        .class-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .class-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #1a237e, #311b92);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.5);
        }
        
        .class-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.8);
        }
        
        /* 班级页面样式 */
        .class-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .class-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }
        
        /* 球体容器 */
        .sphere-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 30px auto;
            perspective: 1200px;
        }
        
        .name-sphere {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 2s;
            animation: rotate 30s infinite linear;
        }
        
        .name-item {
            position: absolute;
            width: 120px;
            text-align: center;
            transform-origin: 0 0;
            color: #fff;
            font-size: 18px;
            padding: 8px;
            text-shadow: 0 0 5px #00f7ff;
            transition: all 1.5s;
            background: rgba(40, 40, 100, 0.8);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }
        
        .name-item.selected {
            background: rgba(255, 50, 50, 0.9);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        
        /* 控制按钮 */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }
        
        .control-btn {
            padding: 15px 30px;
            font-size: 1.3rem;
            background: linear-gradient(45deg, #ff4081, #f50057);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
        }
        
        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
        }
        
        .control-btn:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .reset-btn {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
        }
        
        /* 结果显示 */
        .result {
            margin-top: 30px;
            font-size: 3rem;
            min-height: 80px;
            text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffeb3b;
            transition: all 0.5s;
        }
        
        /* 倒计时显示 */
        .countdown {
            margin-top: 15px;
            font-size: 1.5rem;
            color: #ff9900;
            text-shadow: 0 0 10px #ff9900;
        }
        
        /* 动画 */
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
            }
            to {
                text-shadow: 0 0 20px #00f7ff, 0 0 30px #00f7ff, 0 0 40px #00f7ff;
            }
        }
        
        @keyframes rotate {
            0% {
                transform: rotateY(0) rotateX(0);
            }
            100% {
                transform: rotateY(360deg) rotateX(360deg);
            }
        }
        
        @keyframes fast-rotate {
            0% {
                transform: rotateY(0) rotateX(0);
            }
            100% {
                transform: rotateY(1080deg) rotateX(1080deg);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @keyframes star-explode {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1) translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }
        
        @keyframes star-gather {
            0% {
                transform: scale(1) translate(var(--tx), var(--ty));
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1) translate(0, 0);
                opacity: 0;
            }
        }
        
        @keyframes shooting-star {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(1000px) translateY(1000px) rotate(-45deg);
                opacity: 0;
            }
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .star-name {
            position: absolute;
            font-size: 18px;
            color: white;
            text-shadow: 0 0 5px #00f7ff;
            opacity: 0;
            transition: all 0.5s;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>
    
    <!-- 主界面 -->
    <div class="main-container" id="main">
        <h1 class="title">炫酷点名系统</h1>
        <div class="class-list">
            <button class="class-btn" data-class="2505">2505班</button>
            <button class="class-btn" data-class="2509">2509班</button>
            <button class="class-btn" data-class="2511">2511班</button>
            <button class="class-btn" data-class="2512">2512班</button>
        </div>
    </div>
    
    <!-- 音频元素 -->
    <!-- 请将以下音乐文件替换为您在GitHub上上传的实际文件路径 -->
    <audio id="calm-music" loop>
        <source src="./calm-music.mp3" type="audio/mpeg">
        <!-- 如果浏览器不支持MP3，可以添加其他格式 -->
        <!-- <source src="./calm-music.ogg" type="audio/ogg"> -->
    </audio>
    <audio id="tense-music">
        <source src="./tense-music.mp3" type="audio/mpeg">
        <!-- 如果浏览器不支持MP3，可以添加其他格式 -->
        <!-- <source src="./tense-music.ogg" type="audio/ogg"> -->
    </audio>
    
    <script>
        // 班级数据
        const classData = {
            '2505': ["李可为", "易语", "许演豪", "高凌云", "杨莎莎", "张博轩", "高可欣", "孙鑫敏", "黎茜", "刘欣语", "隋焱臣", "黄子昂", "谢康", "方潇", "李诗雨", "尹涵雪", "李湘", "刘钟迎", "刘勃", "杨秉浩", "马一卉", "何忧", "张銮", "方森烨", "张蔓莎", "伏永淼", "邓帅", "李彦霖", "苏雅媛", "姜翔惟", "李骏成", "夏顺民", "定宇轩", "刘世博", "杨林婕", "刘志康", "余涛", "邹紫燕", "任沈哲", "孙芷涵", "朱灏俊", "何宇创", "方泽文", "韩可馨", "柳金萱", "宋安淇", "艾博文", "鲁恩希", "邓美烯", "张凌洁", "杨子叶", "汪紫涵"],
            '2509': ["方晟睿", "姜奕炫", "任思甜", "张梓萱", "唐宇泽", "余梦瑶", "张雨柔", "李虎", "张峻涛", "周诚", "卢鸿儒", "胡雨馨", "毛佳鑫", "周洋", "刘逸帆", "兰思彤", "陈宸", "付杨智", "陈恺诺", "周睿", "严佳琦", "黄瑶琪", "郭锦祺", "陈梦琳", "黄哲皓", "李思颖", "丁鹏", "方泽西", "周子晗", "王俊杰", "涂伟棋", "冯天宇", "任浩民", "张少杰", "刘钰钊", "张宇轩", "胡依娜", "甘子玲", "刘羽宸", "汤雨欣", "李昕", "戴哲皓", "彭影", "万瑾妤", "吴项宇", "汪莹", "何锦林", "杨浩宇", "刘佳晟", "柳鑫城"],
            '2511': ["李心妍", "石瀚麟", "李雪怡", "蔡佳旺", "廖俊豪", "刘思尹", "彭天乙", "龚俊熙", "马铛", "邹珍妮", "晏永强", "付明轩", "方雅汐", "金贝贝", "龙凯琴", "钟佳睿", "姚鑫程", "周文烨", "任静喧", "吴梓琦", "李玮宁", "张思雨", "杨海婷", "苏细成", "梁琪", "颜英杰", "彭思润", "邹雨婷", "刘思锦", "李鹏", "余旺贵", "余云翔", "任佳玲", "李馨玥", "李志远", "刘美林", "敖涵", "朱涛", "兰振宇", "周梓昊", "刘梓潼", "周文杰", "叶天翔", "杨沐雪", "魏毅博", "杨丽娟", "张宏洋"],
            '2512': ["周云麟", "马旭乐", "刘博文", "刘子晨", "冯峻熙", "曾周恩惠", "鲁屹帆", "刘靖涛", "刘浩宇", "史梁材", "陈燕", "孟芷珏", "贺夤譞", "兰楷雄", "周津紫", "姜雨欣", "黄梦瑶", "程可琴", "兰智林", "冯博威", "姚烨俊", "王梓萌", "刘顺安", "黎志伟", "李心红", "刘家辉", "张浩宇", "魏正阳", "欧阳祥瑞", "刘淑丽", "谭嘉旺", "尹思源", "李翰", "龙梓源", "陈添寿", "屈浩宇", "刘易虎", "方嘉沛", "毛圣强", "李诗琪", "周佳乐", "邓浩阳", "刘子轩", "刘屹涛", "谢根瑜", "陈好", "易雨馨", "毛平燕", "彭子轩"]
        };
        
        // 全局变量
        let currentClassId = null;
        let selectedNames = {};
        let calmMusic, tenseMusic;
        let countdownInterval;
        
        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机大小
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // 随机位置
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // 随机动画延迟和持续时间
                const duration = 20 + Math.random() * 20;
                const delay = Math.random() * 20;
                star.style.animation = `float ${duration}s ${delay}s infinite ease-in-out`;
                
                starsContainer.appendChild(star);
            }
            
            // 创建流星
            createShootingStars();
        }
        
        // 创建流星效果
        function createShootingStars() {
            const starsContainer = document.getElementById('stars');
            
            // 每隔一段时间创建一个流星
            setInterval(() => {
                const shootingStar = document.createElement('div');
                shootingStar.classList.add('shooting-star');
                
                // 随机位置
                const startX = Math.random() * 100;
                const startY = Math.random() * 30;
                shootingStar.style.left = `${startX}%`;
                shootingStar.style.top = `${startY}%`;
                
                // 随机动画持续时间
                const duration = 1 + Math.random() * 2;
                shootingStar.style.animation = `shooting-star ${duration}s linear`;
                
                starsContainer.appendChild(shootingStar);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    if (shootingStar.parentNode) {
                        shootingStar.parentNode.removeChild(shootingStar);
                    }
                }, duration * 1000);
            }, 2000); // 每2秒创建一个流星
        }
        
        // 创建姓名球体
        function createNameSphere(classId, classPage) {
            const nameSphere = classPage.querySelector('.name-sphere');
            nameSphere.innerHTML = '';
            
            const names = classData[classId];
            const radius = 250; // 球体半径
            
            // 创建球体上的点
            for (let i = 0; i < names.length; i++) {
                const nameItem = document.createElement('div');
                nameItem.classList.add('name-item');
                nameItem.textContent = names[i];
                nameItem.dataset.name = names[i];
                
                // 球面坐标计算
                const phi = Math.acos(-1 + (2 * i) / names.length);
                const theta = Math.sqrt(names.length * Math.PI) * phi;
                
                // 转换为3D坐标
                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);
                
                // 设置位置
                nameItem.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                
                // 如果这个姓名已经被选中过，添加选中样式
                if (selectedNames[classId] && selectedNames[classId].includes(names[i])) {
                    nameItem.classList.add('selected');
                }
                
                nameSphere.appendChild(nameItem);
            }
        }
        
        // 姓名爆炸动画（散开）
        function explodeNames(classId, classPage) {
            const names = classData[classId];
            const nameElements = classPage.querySelectorAll('.name-item');
            const container = classPage.querySelector('.sphere-container');
            
            // 清除球体
            classPage.querySelector('.name-sphere').innerHTML = '';
            
            // 创建散开的星星
            names.forEach((name, i) => {
                const starName = document.createElement('div');
                starName.classList.add('star-name');
                starName.textContent = name;
                starName.dataset.name = name;
                
                // 随机位置
                const tx = (Math.random() - 0.5) * 1000;
                const ty = (Math.random() - 0.5) * 1000;
                starName.style.setProperty('--tx', `${tx}px`);
                starName.style.setProperty('--ty', `${ty}px`);
                
                // 设置动画
                starName.style.animation = `star-explode 1.5s ${i * 0.05}s forwards`;
                
                // 如果这个姓名已经被选中过，添加选中样式
                if (selectedNames[classId] && selectedNames[classId].includes(name)) {
                    starName.style.color = '#ff5555';
                    starName.style.textShadow = '0 0 10px #ff0000';
                }
                
                container.appendChild(starName);
            });
        }
        
        // 姓名聚集动画（形成球体）
        function gatherNames(classId, classPage) {
            const names = classData[classId];
            const container = classPage.querySelector('.sphere-container');
            const starNames = container.querySelectorAll('.star-name');
            
            // 为每个星星添加聚集动画
            starNames.forEach((starName, i) => {
                starName.style.animation = `star-gather 1.5s ${i * 0.05}s forwards`;
            });
            
            // 延迟后创建球体
            setTimeout(() => {
                // 清除星星
                container.querySelectorAll('.star-name').forEach(star => star.remove());
                
                // 创建球体
                createNameSphere(classId, classPage);
                
                // 显示球体
                const nameSphere = classPage.querySelector('.name-sphere');
                nameSphere.style.display = 'block';
                nameSphere.style.animation = 'rotate 30s infinite linear';
            }, 1600);
        }
        
        // 语音播报
        function speakName(name) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`恭喜${name}同学`);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }
        
        // 切换音乐
        function switchMusic(type) {
            // 暂停所有音乐
            calmMusic.pause();
            tenseMusic.pause();
            
            // 播放指定类型的音乐
            if (type === 'calm') {
                calmMusic.currentTime = 0;
                calmMusic.play().catch(e => console.log("音乐播放失败:", e));
            } else if (type === 'tense') {
                tenseMusic.currentTime = 0;
                tenseMusic.play().catch(e => console.log("音乐播放失败:", e));
            }
        }
        
        // 开始倒计时
        function startCountdown(classPage, duration) {
            let timeLeft = duration;
            const countdownElement = classPage.querySelector('.countdown');
            
            // 显示倒计时元素
            countdownElement.textContent = `倒计时: ${timeLeft}秒`;
            
            // 清除之前的倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // 开始倒计时
            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownElement.textContent = `倒计时: ${timeLeft}秒`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownElement.textContent = '';
                    
                    // 停止抽奖并显示结果
                    stopLottery(classPage);
                }
            }, 1000);
        }
        
        // 停止抽奖并显示结果
        function stopLottery(classPage) {
            const classId = currentClassId;
            
            // 切换为舒缓音乐
            switchMusic('calm');
            
            // 随机选择一个名字
            const names = classData[classId];
            const availableNames = names.filter(name => !selectedNames[classId].includes(name));
            
            // 如果所有名字都被抽过了，重置
            if (availableNames.length === 0) {
                alert('所有同学都已被抽中！点击重置按钮重新开始。');
                // 重新启用开始按钮
                classPage.querySelector('#start-btn-' + classId).disabled = false;
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * availableNames.length);
            const selectedName = availableNames[randomIndex];
            
            // 记录被选中的名字
            selectedNames[classId].push(selectedName);
            
            // 显示结果
            const result = classPage.querySelector('.result');
            result.textContent = `恭喜 ${selectedName} 同学！`;
            
            // 语音播报
            speakName(selectedName);
            
            // 球体转回中心并爆炸
            const nameSphere = classPage.querySelector('.name-sphere');
            nameSphere.style.animation = 'none';
            
            // 延迟后重新形成球体（包含标记）
            setTimeout(() => {
                explodeNames(classId, classPage);
                
                setTimeout(() => {
                    gatherNames(classId, classPage);
                }, 1500);
            }, 2000);
            
            // 重新启用开始按钮
            classPage.querySelector('#start-btn-' + classId).disabled = false;
        }
        
        // 页面切换
        function showClassPage(classId) {
            document.getElementById('main').style.display = 'none';
            currentClassId = classId;
            
            // 创建班级页面
            const classPage = document.createElement('div');
            classPage.className = 'class-container';
            classPage.id = `class-${classId}`;
            classPage.style.display = 'flex';
            
            // 设置班级页面内容
            classPage.innerHTML = `
                <button class="back-btn">返回主界面</button>
                <h2 class="class-title">${classId}班点名系统</h2>
                
                <!-- 球体容器 -->
                <div class="sphere-container">
                    <div class="name-sphere" id="name-sphere-${classId}" style="display: none;"></div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="start-btn-${classId}">开始抽奖</button>
                    <button class="control-btn reset-btn" id="reset-btn-${classId}">重置抽奖</button>
                </div>
                <div class="countdown" id="countdown-${classId}"></div>
                <div class="result" id="result-${classId}"></div>
            `;
            
            document.body.appendChild(classPage);
            
            // 初始化班级数据
            if (!selectedNames[classId]) {
                selectedNames[classId] = [];
            }
            
            // 立即执行姓名爆炸动画（散开）
            explodeNames(classId, classPage);
            
            // 延迟后执行姓名聚集动画（形成球体）
            setTimeout(() => {
                gatherNames(classId, classPage);
            }, 2000);
            
            // 添加事件监听器
            classPage.querySelector('#start-btn-' + classId).addEventListener('click', function() {
                // 禁用开始按钮
                this.disabled = true;
                
                // 开始快速旋转
                const nameSphere = classPage.querySelector('.name-sphere');
                nameSphere.style.animation = 'fast-rotate 1s infinite linear';
                
                // 切换为急促音乐
                switchMusic('tense');
                
                // 开始10秒倒计时
                startCountdown(classPage, 10);
            });
            
            classPage.querySelector('#reset-btn-' + classId).addEventListener('click', function() {
                // 重置选中名单
                selectedNames[classId] = [];
                
                // 清除结果
                classPage.querySelector('.result').textContent = '';
                
                // 清除倒计时
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    classPage.querySelector('.countdown').textContent = '';
                }
                
                // 重置球体
                explodeNames(classId, classPage);
                
                setTimeout(() => {
                    gatherNames(classId, classPage);
                }, 1500);
                
                // 确保按钮状态正确
                classPage.querySelector('#start-btn-' + classId).disabled = false;
                
                // 切换为舒缓音乐
                switchMusic('calm');
            });
            
            classPage.querySelector('.back-btn').addEventListener('click', function() {
                document.body.removeChild(classPage);
                document.getElementById('main').style.display = 'flex';
                currentClassId = null;
                
                // 清除倒计时
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                }
                
                // 切换为舒缓音乐
                switchMusic('calm');
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            
            // 初始化音乐
            calmMusic = document.getElementById('calm-music');
            tenseMusic = document.getElementById('tense-music');
            
            calmMusic.volume = 0.5;
            tenseMusic.volume = 0.5;
            
            // 尝试播放舒缓音乐
            try {
                calmMusic.play();
            } catch (e) {
                console.log("自动播放被阻止，需要用户交互");
            }
            
            // 为班级按钮添加事件监听器
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const classId = this.getAttribute('data-class');
                    showClassPage(classId);
                });
            });
            
            // 为背景音乐添加交互播放
            document.body.addEventListener('click', function() {
                if (calmMusic.paused) {
                    calmMusic.play().catch(e => console.log("播放失败:", e));
                }
            }, { once: true });
        });
    </script>
</body>
</html>
